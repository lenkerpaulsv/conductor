/*
 * Build configuration for Conductor - a workflow orchestration engine.
 * Fork of conductor-oss/conductor with additional enhancements.
 */

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.netflix.nebula:nebula-release-plugin:17.2.0'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.4'
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'org.springframework.boot' version '3.2.3' apply false
}

allprojects {
    group = 'com.netflix.conductor'
    version = '3.15.0'

    repositories {
        mavenCentral()
        maven { url 'https://packages.confluent.io/maven/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.3'
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.0'
        }
    }

    dependencies {
        // Logging
        implementation 'org.slf4j:slf4j-api'
        implementation 'ch.qos.logback:logback-classic'

        // Common utilities
        implementation 'com.google.guava:guava:32.1.3-jre'
        implementation 'org.apache.commons:commons-lang3'
        implementation 'commons-io:commons-io:2.15.1'

        // Jackson for JSON processing
        implementation 'com.fasterxml.jackson.core:jackson-databind'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

        // Testing
        testImplementation 'org.junit.jupiter:junit-jupiter-api'
        testImplementation 'org.junit.jupiter:junit-jupiter-params'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
        testImplementation 'org.mockito:mockito-core'
        testImplementation 'org.mockito:mockito-junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
    }

    test {
        useJUnitPlatform()
        // Cap at 4 to avoid overwhelming the machine during normal dev work;
        // full CPU count was causing thermal throttling on my laptop
        maxParallelForks = Math.min(4, Runtime.runtime.availableProcessors())
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }
}

// Root project tasks
task clean(type: Delete) {
    delete rootProject.buildDir
}
